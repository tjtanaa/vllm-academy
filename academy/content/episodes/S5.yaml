  - id: E26
    season: S5
    minutes: 15
    title:
      en: "Public proof beats a perfect CV"
      zh: "公開的證明，勝過完美的履歷"
    hook:
      en: "Hiring managers for inference roles look at GitHub before they look at your GPA. A merged PR, an honest benchmark and one good blog post get noticed faster than a certificate."
      zh: "推論職位的主管會先看你的 GitHub，才看你的成績。一個被 merge 的 PR、一份誠實的 benchmark、一篇好文章，比一張證書更快被看見。"
    aha:
      en: |-
        Build a **proof stack**, smallest first:

        1. **A write-up:** explain one mechanism (PagedAttention, chunked prefill…) with your own diagram and numbers from your Q7 benchmark.
        2. **A reproducible benchmark:** pinned versions, percentiles, raw data in a repo.
        3. **An upstream contribution:** a fix, test, model support or doc that maintainers actually needed.
        4. **A talk:** 5 minutes at a study group, a vLLM meetup or a COSCUP BoF.

        Resume bullets: **verb + what + measured result + context.** "Added X to vLLM's Y; reduced p99 TTFT 18% on Z workload (PR #…)."

        In Taiwan, programs like the TAIONE vLLM Fellowship Track (with Embedded LLM) are set up exactly to mentor people through upstream work.
      zh: |-
        打造一組**證明堆疊**，從最小的開始：

        1. **一篇文章：** 用自己的圖和 Q7 benchmark 的數據，解釋一個機制（PagedAttention、chunked prefill…）。
        2. **一份可重現的 benchmark：** 固定版本、百分位數、原始資料放在 repo 裡。
        3. **一個上游貢獻：** 維護者真的需要的修正、測試、模型支援或文件。
        4. **一場分享：** 在讀書會、vLLM meetup 或 COSCUP BoF 講 5 分鐘。

        履歷條目：**動詞 + 做了什麼 + 量測結果 + 情境。**「在 vLLM 的 Y 加入 X；在 Z 工作負載下讓 p99 TTFT 降低 18%（PR #…）。」

        在台灣，像 TAIONE vLLM Fellowship Track（與 Embedded LLM 合作）這樣的計畫，就是專門帶人走完上游貢獻流程的。
    tldr:
      en:
        - "Proof stack: write-up → reproducible benchmark → upstream PR → talk."
        - "Resume bullets need a measured result and context."
        - "Use the community: study groups, meetups, fellowships and code review."
      zh:
        - "證明堆疊：文章 → 可重現 benchmark → 上游 PR → 分享。"
        - "履歷條目要有量測結果與情境。"
        - "善用社群：讀書會、meetup、fellowship 與 code review。"
    pro:
      en: "Tell me about a project you're proud of? Use STAR with numbers: the situation (serving bottleneck), the task, the specific action (what you changed and how you validated it), and the measured result with context and a link. Inference interviewers probe depth, so pick something where you can go three 'why?'s deep."
      zh: "「說說你最自豪的專案？」用 STAR 加上數字：情境（服務瓶頸）、任務、具體行動（改了什麼、怎麼驗證）、量測結果（附情境與連結）。推論面試官會往深處追問，所以選一個你能被連問三次「為什麼？」都答得出來的專案。"
    followup:
      en: "What's one thing in vLLM you'd change if you were a maintainer, and why?"
      zh: "如果你是維護者，你會改 vLLM 的哪一件事？為什麼？"
    lab: null
    lab_hint:
      en: "Fill in `templates/LEARNER_SUBMISSION.md` and post your proof stack in #show-your-work."
      zh: "填好 `templates/LEARNER_SUBMISSION.md`，把你的證明堆疊貼到 #show-your-work。"
