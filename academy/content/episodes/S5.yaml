  - id: E25
    season: S5
    minutes: 30
    title:
      en: "The inference-engineer interview, decoded"
      zh: "推論工程師面試，一次拆解"
    hook:
      en: "The same handful of system-design prompts show up again and again: serve a 70B on 4 GPUs, estimate max throughput, handle 200k-token context. Here's the framework that answers all of them."
      zh: "同樣幾題系統設計反覆出現：用 4 張 GPU 服務 70B、估算最大吞吐量、處理 20 萬 token 的 context。這裡有一套能回答全部的框架。"
    aha:
      en: |-
        Use the same 7-step skeleton for any LLM-serving design question:

        1. **Requirements:** model, QPS, input/output lengths, TTFT/ITL SLOs, cost target.
        2. **Memory math:** weights + KV per token × context × concurrency (E07).
        3. **Placement:** which parallelism and how many replicas (E19).
        4. **Batching and scheduling:** continuous batching, token budget, chunked prefill, priorities (E09, E11).
        5. **Caching:** prefix caching, cache-aware routing, KV offload (E10, E21).
        6. **Speed levers:** quantization, speculative decoding, disaggregation (E17, E18, E20).
        7. **Operate it:** metrics (TTFT/ITL percentiles, KV usage, queue depth), autoscaling, failure modes, rollouts.

        Say numbers out loud. Interviewers remember the candidate who said "about 320 KiB per token, so only three or four 128k sessions per node."
      zh: |-
        任何 LLM 服務的系統設計題，都用同一套 7 步驟骨架：

        1. **需求：** 模型、QPS、輸入/輸出長度、TTFT/ITL SLO、成本目標。
        2. **記憶體計算：** 權重 + 每 token KV × context × 並行數（E07）。
        3. **配置：** 用哪種平行化、要幾個副本（E19）。
        4. **批次與排程：** continuous batching、token 預算、chunked prefill、優先權（E09、E11）。
        5. **快取：** prefix caching、感知快取的路由、KV offload（E10、E21）。
        6. **加速槓桿：** 量化、推測解碼、分離部署（E17、E18、E20）。
        7. **營運：** 指標（TTFT/ITL 百分位數、KV 使用率、佇列深度）、自動擴展、故障模式、上線流程。

        把數字說出來。面試官會記得那個說「每個 token 大約 320 KiB，所以一個節點只放得下三到四個 128k session」的人。
    tldr:
      en:
        - "Requirements → memory math → placement → batching → caching → speed levers → operations."
        - "Quantify everything: bytes per token, GPUs, concurrency, latency budgets."
        - "Practice out loud with /mock until the skeleton is automatic."
      zh:
        - "需求 → 記憶體計算 → 配置 → 批次 → 快取 → 加速槓桿 → 營運。"
        - "全部量化：每 token bytes、GPU 數、並行數、延遲預算。"
        - "用 /mock 大聲練習，直到這套骨架變成反射動作。"
    pro:
      en: "I start by pinning requirements and SLOs, then do the memory budget: weights plus per-token KV times expected concurrent context. That tells me the minimum GPUs and the parallelism. Next comes the batching and scheduling policy, the caching strategy and routing, then optional levers like quantization, speculative decoding or disaggregation, each justified by which bottleneck it hits. I finish with the metrics and failure modes I'd monitor."
      zh: "我會先把需求與 SLO 定下來，接著做記憶體預算：權重加上每 token KV 乘以預期的同時 context 量，這決定最少需要幾張 GPU 與平行策略。然後是批次與排程策略、快取策略與路由，再來是量化、推測解碼或分離部署等可選槓桿，每一個都說明它打的是哪個瓶頸。最後說明我會監控的指標與故障模式。"
    followup:
      en: "Now traffic triples during the Taiwan evening peak. What changes first?"
      zh: "現在台灣晚間尖峰流量變成三倍。最先要改的是什麼？"
    lab: Q9
    lab_hint:
      en: "Run `/mock` in Discord. Five questions, rate yourself honestly, review the model answers."
      zh: "在 Discord 執行 `/mock`。五題，誠實替自己打分數，再看參考答案。"
