episodes:
  - id: E23
    season: S5
    minutes: 25
    title:
      en: "Your first vLLM PR in 7 steps (without being \"that\" contributor)"
      zh: "7 步送出你的第一個 vLLM PR（而且不當「那種」貢獻者）"
    hook:
      en: "Maintainers love some first PRs and close others within minutes. The difference isn't talent. It's seven habits."
      zh: "有些第一次的 PR 讓維護者很開心，有些幾分鐘就被關掉。差別不在天分，在七個習慣。"
    aha:
      en: |-
        1. **Pick real work:** a `good first issue`, the onboarding project board, a bug you actually hit, or a model request.
        2. **Check for duplicates:** read the issue comments and search open PRs first.
        3. **Set up fast:** `VLLM_USE_PRECOMPILED=1 uv pip install -e .` lets you edit Python without compiling CUDA.
        4. **Reproduce, then write a failing test.**
        5. **Make the smallest fix that passes**, then `pre-commit run`.
        6. **Sign off:** `git commit -s` (DCO is required).
        7. **Write a reviewable PR:** a tagged title like `[Bugfix][Scheduler] …`, what and why, the exact test commands with results, and an AI-assistance disclosure if you used it.

        Don'ts: one-typo "busywork" PRs; agent-generated PRs you can't defend line by line. vLLM's policy explicitly rejects both.
      zh: |-
        1. **挑真正的工作：** `good first issue`、新手專案看板、你真的遇到的 bug，或模型支援請求。
        2. **先查有沒有重複：** 讀 issue 留言、搜尋開著的 PR。
        3. **快速建好環境：** `VLLM_USE_PRECOMPILED=1 uv pip install -e .`，不用編譯 CUDA 就能改 Python。
        4. **先重現，再寫一個會失敗的測試。**
        5. **做能讓測試通過的最小修改**，接著跑 `pre-commit run`。
        6. **簽署：** `git commit -s`（必須符合 DCO）。
        7. **寫一個好審的 PR：** 帶標籤的標題，例如 `[Bugfix][Scheduler] …`；說明做了什麼、為什麼；附上實際執行的測試指令與結果；如果用了 AI 輔助要揭露。

        不要做的事：只改一個錯字的「湊數」PR；你沒辦法逐行解釋的 agent 生成 PR。vLLM 的政策明確拒絕這兩種。
    tldr:
      en:
        - "Real issue → dedupe → precompiled dev install → failing test → minimal fix → `-s` sign-off → reviewable PR."
        - "Tag the title, include test commands and results, disclose AI assistance."
        - "No busywork PRs and no pure-agent PRs: you must be able to defend every line."
      zh:
        - "真實 issue → 查重 → 預編譯開發安裝 → 失敗的測試 → 最小修改 → `-s` 簽署 → 好審的 PR。"
        - "標題加標籤、附測試指令與結果、揭露 AI 輔助。"
        - "不要湊數 PR、不要純 agent PR：每一行你都要能解釋。"
    pro:
      en: "My process for a first contribution: pick a reproducible issue, confirm nobody's already on it, reproduce it locally with a minimal script, encode it as a failing test, make the narrowest fix, run pre-commit and the relevant test subset, then open a tagged PR with motivation, test evidence and any limitations. I keep the diff small so a busy reviewer can approve it in one sitting, and I respond to review within a day or two."
      zh: "我第一次貢獻的流程：挑一個可重現的 issue，確認沒人在做，用最小腳本在本機重現，寫成會失敗的測試，做最小範圍的修正，跑 pre-commit 與相關測試，再開一個帶標籤的 PR，寫清楚動機、測試證據與限制。我會讓 diff 保持精簡，讓忙碌的審查者一次就能看完核准，並在一兩天內回覆審查意見。"
    followup:
      en: "Your PR has been waiting 10 days without review. What do you do?"
      zh: "你的 PR 等了 10 天都沒人審。你會怎麼做？"
    lab: Q8
    lab_hint:
      en: "Do Q8 up to step 5 this week. Ask for help in #labs-help, and post your draft PR link in #show-your-work."
      zh: "這週把 Q8 做到第 5 步。有問題到 #labs-help 問，草稿 PR 連結貼到 #show-your-work。"
    deep_dive: course/part4/17-contributing.md
