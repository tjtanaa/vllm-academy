  - id: E24
    season: S5
    minutes: 20
    title:
      en: "Benchmark like a pro: TTFT, ITL and the lie of averages"
      zh: "像專家一樣做 benchmark：TTFT、ITL 與平均值的謊言"
    hook:
      en: "\"It's 2× faster\" means nothing. Faster at what metric, which percentile, which workload, which request rate, against which baseline? Learn the five numbers that matter."
      zh: "「快了 2 倍」等於什麼都沒說。哪個指標？哪個百分位數？什麼工作負載？什麼請求速率？跟什麼比？學會真正重要的五個數字。"
    aha:
      en: |-
        - **TTFT** (time to first token): queueing + prefill. It's what users feel as "it started answering".
        - **ITL / TPOT** (inter-token latency, time per output token): smoothness of streaming.
        - **E2E latency** = TTFT + output tokens × TPOT (roughly).
        - **Throughput:** requests/s and output tokens/s at a given load.
        - **Goodput:** throughput that still meets your SLOs.

        Always report **p50/p90/p99**, not just the mean. One stalled request in a hundred is invisible in an average and very visible to a user.

        Pin everything: vLLM version, flags, model, GPU, dataset, input/output lengths, request rate or concurrency, warm vs cold prefix cache, number of runs. `vllm bench serve` gives you most of this.
      zh: |-
        - **TTFT**（首個 token 時間）：排隊 + prefill。也就是使用者感覺到的「它開始回答了」。
        - **ITL／TPOT**（token 間延遲、每個輸出 token 的時間）：串流的順暢度。
        - **E2E 延遲** ≈ TTFT + 輸出 token 數 × TPOT。
        - **吞吐量：** 在特定負載下的每秒請求數與每秒輸出 token 數。
        - **Goodput：** 仍然符合 SLO 的吞吐量。

        一定要回報 **p50/p90/p99**，不能只看平均值。一百個請求裡有一個卡住，在平均值裡看不出來，但使用者看得非常清楚。

        把所有東西都固定下來：vLLM 版本、參數、模型、GPU、資料集、輸入/輸出長度、請求速率或並行數、prefix cache 是冷是熱、跑了幾次。`vllm bench serve` 能幫你處理大部分。
    tldr:
      en:
        - "TTFT = responsiveness; ITL/TPOT = streaming smoothness; throughput and goodput = capacity."
        - "Report percentiles (p50/p90/p99), never just averages."
        - "A benchmark without pinned versions, workload and load level isn't reproducible."
      zh:
        - "TTFT = 回應速度；ITL/TPOT = 串流順暢度；吞吐量與 goodput = 容量。"
        - "回報百分位數（p50/p90/p99），不要只給平均。"
        - "沒有固定版本、工作負載與負載水準的 benchmark，無法重現。"
    pro:
      en: "I benchmark with a fixed, realistic workload: input/output length distributions, an arrival process or fixed concurrency, and warm vs cold cache stated explicitly. I sweep request rate to get the latency-throughput curve and report TTFT and ITL at p50/p90/p99 plus goodput under an SLO. Versions, flags and hardware are pinned and every config is run multiple times. Any claim names the baseline and the regime, because a win at low load can be a loss at high load."
      zh: "我用固定且真實的工作負載做 benchmark：輸入/輸出長度分布、到達過程或固定並行數，並明確說明 cache 是冷是熱。掃描請求速率畫出延遲-吞吐量曲線，回報 TTFT 與 ITL 的 p50/p90/p99，以及在 SLO 下的 goodput。版本、參數與硬體全部固定，每個設定跑多次。任何結論都會說明比較基準與適用區間，因為低負載時的勝利，可能是高負載時的失敗。"
    followup:
      en: "Throughput went up 30% but p99 TTFT doubled. Is that a win?"
      zh: "吞吐量上升 30%，但 p99 TTFT 變成兩倍。這算贏嗎？"
    lab: Q7
    lab_hint:
      en: "Run Q7: benchmark the same workload with prefix caching on vs off and fill in the report template."
      zh: "執行 Q7：同一份工作負載，開與不開 prefix caching 各跑一次 benchmark，填好報告範本。"
