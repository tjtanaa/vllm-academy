  - id: E12
    season: S2
    minutes: 30
    title:
      en: "Boss fight: your mini-vLLM passes 30 tests"
      zh: "魔王關：你的 mini-vLLM 通過 30 個測試"
    hook:
      en: "Reading about engines is easy. Building one that doesn't leak a single block under cancellation, eviction and late arrivals is the real flex."
      zh: "讀引擎的文章很簡單。真正厲害的是寫出一個在取消、淘汰、半路加入的情況下，一個 block 都不會漏掉的引擎。"
    aha:
      en: |-
        The repo's `mini_vllm/` is a ~500-line CPU engine with paged KV, ref-counted blocks, chained prefix reuse, token-budget scheduling and cancellation. Your mission: rebuild it milestone by milestone **before** you peek.

        M1 dense decoder → M2 incremental KV → M3 pages and block tables → M4 queues and token budget → M5 prefix identity and reuse → M6 lifecycle stress.

        The tests encode the invariants maintainers care about: cached logits equal dense logits, no block freed while in use, no double release, everything returned after `close()`.
      zh: |-
        Repo 裡的 `mini_vllm/` 是一個約 500 行的 CPU 引擎，有分頁 KV、參照計數 block、串接式前綴重用、token 預算排程與取消功能。你的任務：在偷看答案**之前**，一個里程碑一個里程碑地把它重寫出來。

        M1 dense decoder → M2 增量 KV → M3 分頁與 block table → M4 佇列與 token 預算 → M5 前綴識別與重用 → M6 生命週期壓力測試。

        這些測試寫的都是維護者在乎的不變量：有快取的 logits 等於 dense logits、使用中的 block 不會被釋放、不會重複釋放、`close()` 之後所有東西都歸還。
    tldr:
      en:
        - "Six milestones from dense decoder to a lifecycle-safe engine."
        - "Tests are the spec: equivalence, ownership and cleanup invariants."
        - "Try mutation challenges: break one rule and see which test catches it."
      zh:
        - "六個里程碑：從 dense decoder 到生命週期安全的引擎。"
        - "測試就是規格：等價性、所有權與清理的不變量。"
        - "挑戰突變測試：故意破壞一條規則，看哪個測試抓到它。"
    pro:
      en: "I built a small paged-KV inference engine: a block pool with reference counts, per-request block tables, chained-hash prefix reuse limited to full blocks, and a token-budget scheduler with cancellation. I validated it by checking cached-vs-dense logit equivalence across chunk boundaries and with lifecycle tests for eviction, exhaustion and cleanup. It's deliberately serial, so I can explain exactly what production adds."
      zh: "我做過一個小型的分頁 KV 推論引擎：有參照計數的 block pool、每個請求的 block table、只針對填滿 block 的串接 hash 前綴重用，以及支援取消的 token 預算排程器。驗證方式是檢查跨 chunk 邊界時有快取與 dense 的 logits 是否一致，並用生命週期測試涵蓋淘汰、資源耗盡與清理。它刻意是序列執行的，所以我可以精確說明生產環境多做了哪些事。"
    followup:
      en: "Your engine is correct but slow. What are the first three things production vLLM does differently?"
      zh: "你的引擎是正確的，但很慢。生產版 vLLM 最先做的三件不同的事是什麼？"
    lab: Q5
    lab_hint:
      en: "Follow `labs/MILESTONES.md`. Run `python -m pytest -q` until it's green."
      zh: "照著 `labs/MILESTONES.md` 做。一直跑 `python -m pytest -q` 直到全綠。"
    deep_dive: labs/MILESTONES.md
    code: [scheduler, kv_cache_manager, block_pool]
