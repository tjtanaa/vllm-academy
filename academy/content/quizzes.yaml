  - id: q-e25-1
    episode: E25
    q: {en: "In an LLM-serving design interview, what should come right after clarifying requirements?", zh: "在 LLM 服務的設計面試中，釐清需求之後下一步應該做什麼？"}
    options:
      en: ["Pick a vector database", "Memory math: weights + KV × context × concurrency", "Write Kubernetes YAML", "Choose a frontend framework"]
      zh: ["挑一個向量資料庫", "記憶體計算：權重 + KV × context × 並行數", "寫 Kubernetes YAML", "選前端框架"]
    answer: 1
    explain:
      en: "Memory sets the minimum hardware and parallelism; everything else builds on it."
      zh: "記憶體決定最少需要的硬體與平行策略；其他一切都建立在它之上。"
  - id: q-e26-1
    episode: E26
    q: {en: "Which resume bullet is strongest?", zh: "哪一條履歷條目最有力？"}
    options:
      en: ["Familiar with vLLM", "Passionate about LLM inference", "Added X to vLLM's scheduler; cut p99 TTFT 18% on a 4k/512 chat workload (PR #…)", "Completed an online course"]
      zh: ["熟悉 vLLM", "對 LLM 推論充滿熱情", "在 vLLM 排程器加入 X；在 4k/512 聊天工作負載下讓 p99 TTFT 降低 18%（PR #…）", "完成一門線上課程"]
    answer: 2
    explain:
      en: "Verb + what + measured result + context + link."
      zh: "動詞 + 做了什麼 + 量測結果 + 情境 + 連結。"
  # ---- S6 Frontier Watch ----
  - id: q-e27-1
    episode: E27
    q: {en: "Compared with a chatbot request, a typical agent turn has…", zh: "跟聊天機器人的請求相比，典型的 agent 回合有…"}
    options:
      en: ["A short prompt and a long answer", "A long, mostly repeated prefix and a short output", "No prompt at all", "Only image inputs"]
      zh: ["短 prompt、長回答", "很長且大多重複的前綴，加上很短的輸出", "完全沒有 prompt", "只有圖片輸入"]
    answer: 1
    explain:
      en: "System prompt + tool schemas + history come back every turn; the output is often a single tool call."
      zh: "System prompt + 工具定義 + 歷史每回合都會再出現；輸出常常只是一個工具呼叫。"
  - id: q-e27-2
    episode: E27
    q: {en: "An agent pauses 20 s for a tool, then returns with its 100k-token context. What avoids re-prefilling everything?", zh: "Agent 為了一個工具暫停 20 秒，接著帶著 10 萬 token 的 context 回來。怎樣能避免全部重新 prefill？"}
    options:
      en: ["A bigger max_tokens", "Keeping its KV blocks reachable, e.g. offloaded to CPU/SSD, plus prefix-cache lookup", "Turning off prefix caching", "Lowering the temperature"]
      zh: ["把 max_tokens 調大", "讓它的 KV block 還找得到（例如 offload 到 CPU/SSD），再加上 prefix cache 查找", "關掉 prefix caching", "調低 temperature"]
    answer: 1
    explain:
      en: "Recomputing 100k tokens costs seconds of GPU time; loading cached KV back is usually far cheaper."
      zh: "重新計算 10 萬個 token 要花好幾秒 GPU 時間；把快取的 KV 載回來通常便宜得多。"
  - id: q-e27-3
    episode: E27
    q: {en: "Why do agentic benchmarks report throughput 'at 150 tok/s per user'?", zh: "為什麼 agent benchmark 要回報「每位使用者 150 tok/s 下」的吞吐量？"}
    options:
      en: ["It's a marketing number", "Max throughput at any latency hides how slow each agent becomes; a per-user floor measures useful capacity", "Agents can't read faster than 150 tok/s", "It's required by the OpenAI API"]
      zh: ["那只是行銷數字", "不限延遲的最大吞吐量會掩蓋每個 agent 變得多慢；設定每人下限才量得出有用的容量", "Agent 讀不了超過 150 tok/s", "OpenAI API 規定的"]
    answer: 1
    explain:
      en: "It's goodput thinking: capacity that still meets the speed users (or agents) need."
      zh: "這就是 goodput 的思維：在仍符合使用者（或 agent）所需速度下的容量。"
  - id: q-e28-1
    episode: E28
    q: {en: "Which is NOT part of a vLLM engine's startup?", zh: "下列哪一項「不是」vLLM 引擎啟動的一部分？"}
    options:
      en: ["Loading weights onto the GPU", "Capturing CUDA graphs", "Profiling memory to size the KV cache", "Fine-tuning the model on your prompts"]
      zh: ["把權重載入 GPU", "擷取 CUDA graph", "量測記憶體以決定 KV cache 大小", "用你的 prompt 微調模型"]
    answer: 3
    explain:
      en: "Startup is fetch → load/quantize → profile + compile → KV allocation → CUDA-graph capture. No training happens."
      zh: "啟動流程是 取得 → 載入／量化 → 量測 + 編譯 → 配置 KV → 擷取 CUDA graph。不會做任何訓練。"
  - id: q-e28-2
    episode: E28
    q: {en: "What does `vllm preload` (v0.31) keep alive across engine restarts?", zh: "`vllm preload`（v0.31）在引擎重啟之間讓什麼保持存活？"}
    options:
      en: ["The HTTP connections", "Post-quantized weights resident in GPU memory", "The KV cache of every user", "The Python interpreter"]
      zh: ["HTTP 連線", "常駐在 GPU 記憶體中的量化後權重", "每個使用者的 KV cache", "Python 直譯器"]
    answer: 1
    explain:
      en: "A per-GPU daemon owns the weights so a restarted engine maps them in instead of reloading."
      zh: "每張 GPU 上的常駐程式持有權重，重啟的引擎直接映射進來，不用重新載入。"
  - id: q-e28-3
    episode: E28
    q: {en: "The main cost of keeping weights resident for fast scale-up is…", zh: "為了快速擴展而讓權重常駐，主要代價是…"}
    options:
      en: ["Worse output quality", "GPU memory held by idle weights that could serve something else", "Slower decode", "It breaks prefix caching"]
      zh: ["輸出品質變差", "閒置權重佔住的 GPU 記憶體，本來可以拿去服務別的東西", "Decode 變慢", "會破壞 prefix caching"]
    answer: 1
    explain:
      en: "Residency trades memory for startup time. Burstier traffic makes the trade more worthwhile."
      zh: "常駐是用記憶體換啟動時間。流量越突發，這筆交易越划算。"
  # ---- round 2: every episode gets at least 3 questions ----
  - id: q-e04-3
    episode: E04
    q: {en: "Why is inference, not training, the bigger long-run compute bill for a popular model?", zh: "對一個熱門模型來說，為什麼長期最大的算力帳單是推論，而不是訓練？"}
    options:
      en: ["Inference uses FP64", "Training happens once; inference runs every time any user sends a request", "Inference can't be batched", "Training is free on TPUs"]
      zh: ["推論用 FP64", "訓練只做一次；推論在每個使用者每次送出請求時都會執行", "推論無法批次處理", "在 TPU 上訓練是免費的"]
    answer: 1
    explain:
      en: "Usage scales with users × requests × tokens, for the whole life of the product."
      zh: "用量會隨著 使用者 × 請求 × token 成長，而且持續整個產品生命週期。"
  - id: q-e12-3
    episode: E12
    q: {en: "A mutation (a deliberately injected bug) survives the whole test suite. What does that tell you?", zh: "一個刻意植入的 bug（mutation）通過了整個測試套件。這代表什麼？"}
    options:
      en: ["The engine is correct", "There's a coverage gap: add a test for the invariant it broke", "Delete the mutation and move on", "pytest is broken"]
      zh: ["引擎是正確的", "測試有漏洞：要為它破壞的不變量補上測試", "刪掉這個 mutation 繼續做", "pytest 壞了"]
    answer: 1
    explain:
      en: "Mutation testing measures your tests, not your code. A surviving mutant is a missing assertion."
      zh: "Mutation testing 量的是你的測試，不是你的程式碼。存活的 mutant 就是少了一個 assertion。"
  - id: q-e16-3
    episode: E16
    q: {en: "Before opening a new-model PR, the most convincing correctness evidence is…", zh: "在送出新模型的 PR 之前，最有說服力的正確性證據是…"}
    options:
      en: ["It runs without crashing", "Logits or greedy outputs match the Hugging Face reference on fixed prompts, at TP=1 and TP>1", "A high tokens/s number", "The model card says it works"]
      zh: ["跑起來不會當掉", "在固定 prompt 上，logits 或 greedy 輸出與 Hugging Face 參考實作一致，TP=1 與 TP>1 都要", "很高的 tokens/s", "模型卡說可以用"]
    answer: 1
    explain:
      en: "Fast and wrong is worse than slow. Match the reference first, then optimize."
      zh: "又快又錯比慢還糟。先和參考實作對齊，再談最佳化。"
  - id: q-e18-3
    episode: E18
    q: {en: "Switching the KV cache from BF16 to FP8 (same model, same GPU) mainly gives you…", zh: "把 KV cache 從 BF16 換成 FP8（同模型、同 GPU），主要帶來的是…"}
    options:
      en: ["Smaller weights", "About 2× more KV capacity, so more concurrent sequences or longer contexts", "Faster tokenization", "Better accuracy"]
      zh: ["權重變小", "KV 容量大約變 2 倍，可以放更多並行序列或更長的 context", "斷詞更快", "準確度更好"]
    answer: 1
    explain:
      en: "KV bytes per token halve. Try it with /kvcalc kv_dtype:fp8, then check quality on your task."
      zh: "每個 token 的 KV bytes 減半。用 /kvcalc kv_dtype:fp8 試試，然後在你的任務上檢查品質。"
  - id: q-e20-3
    episode: E20
    q: {en: "vLLM's P/D guide measured 2×L40S over PCIe without peer-to-peer. What got worse with P/D?", zh: "vLLM 的 P/D 指南在 2 張 L40S、走 PCIe 且沒有 P2P 的環境下實測。用了 P/D 之後什麼變差了？"}
    options:
      en: ["p99 inter-token latency", "Median TTFT, because each KV transfer took ~1.3 s", "Output quality", "Nothing"]
      zh: ["p99 inter-token latency", "中位數 TTFT，因為每次 KV 傳輸要約 1.3 秒", "輸出品質", "沒有任何東西變差"]
    answer: 1
    explain:
      en: "ITL improved a lot (169 → 29 ms p99), but TTFT went 0.7 s → 2.2 s. Fix the fabric before you split."
      zh: "ITL 大幅改善（p99 169 → 29 ms），但 TTFT 從 0.7 秒變 2.2 秒。拆開之前，先把網路搞定。"
  - id: q-e21-3
    episode: E21
    q: {en: "Which workload benefits MOST from tiered KV offloading?", zh: "哪一種工作負載最能受益於分層 KV offload？"}
    options:
      en: ["One-shot short prompts that never repeat", "Multi-turn chats and agents whose long contexts come back after a pause", "Batch embedding jobs", "Image classification"]
      zh: ["只問一次、從不重複的短 prompt", "多輪對話與 agent，長 context 暫停後還會再回來", "批次 embedding 任務", "圖片分類"]
    answer: 1
    explain:
      en: "Offload only pays off if the KV will be needed again. Returning long contexts are exactly that."
      zh: "只有 KV 之後還會再用到，offload 才划算。會回來的長 context 正是如此。"
  - id: q-e22-3
    episode: E22
    q: {en: "Why do RL frameworks care so much about fast weight transfer into vLLM?", zh: "為什麼 RL 框架這麼在意把權重快速傳進 vLLM？"}
    options:
      en: ["To save disk space", "Every training step produces new weights, and rollouts must use them; slow sync leaves GPUs idle", "vLLM can't load checkpoints from disk", "It improves tokenization"]
      zh: ["為了省磁碟空間", "每個訓練步驟都會產生新權重，rollout 必須用新權重；同步太慢 GPU 就會閒置", "vLLM 不能從磁碟載入 checkpoint", "它能改善斷詞"]
    answer: 1
    explain:
      en: "Moving Kimi K2's weights across 48 nodes in 7.53 s (Ray Direct Transport) is that problem being solved."
      zh: "用 Ray Direct Transport 在 7.53 秒內把 Kimi K2 的權重傳到 48 個節點，解決的就是這個問題。"
  - id: q-e25-2
    episode: E25
    q: {en: "The interviewer asks you to 'serve Llama-70B for 1,000 users'. Your first move?", zh: "面試官要你「為 1,000 個使用者服務 Llama-70B」。你的第一步？"}
    options:
      en: ["Name your favorite GPU", "Ask clarifying questions: context length, QPS, latency SLOs, budget", "Start writing Kubernetes YAML", "Say 'use vLLM' and stop"]
      zh: ["說出你最喜歡的 GPU", "先問清楚：context 長度、QPS、延遲 SLO、預算", "開始寫 Kubernetes YAML", "說「用 vLLM」就結束"]
    answer: 1
    explain:
      en: "'1,000 users' could mean 10 or 10,000 concurrent requests. Requirements decide everything that follows."
      zh: "「1,000 個使用者」可能代表 10 個或 10,000 個並行請求。需求決定後面的一切。"
  - id: q-e25-3
    episode: E25
    q: {en: "Which answer pattern scores best on an inference concept question?", zh: "回答推論觀念題時，哪一種答法分數最高？"}
    options:
      en: ["A long list of buzzwords", "Mechanism → a concrete number → the trade-off → when you wouldn't use it", "'It depends' and nothing else", "Reciting the paper abstract"]
      zh: ["一長串流行術語", "機制 → 一個具體數字 → 取捨 → 什麼時候不該用", "只說「看情況」", "背誦論文摘要"]
    answer: 1
    explain:
      en: "Interviewers listen for understanding plus judgment. The 'when not to' part shows you've actually used it."
      zh: "面試官要聽的是理解加判斷力。「什麼時候不該用」這部分，證明你真的用過。"
  - id: q-e26-2
    episode: E26
    q: {en: "Which portfolio item is most likely to get you an inference-engineering interview?", zh: "哪一項作品最可能幫你拿到推論工程師的面試？"}
    options:
      en: ["A certificate of completion", "A reproducible benchmark write-up with raw data and exact commands", "A list of courses taken", "A screenshot of ChatGPT"]
      zh: ["一張結業證書", "一份可重現的 benchmark 分析，附原始資料與完整指令", "修過的課程清單", "一張 ChatGPT 截圖"]
    answer: 1
    explain:
      en: "Public, checkable proof beats claims. Q7 produces exactly this."
      zh: "公開、可驗證的證明勝過空口說白話。Q7 產出的就是這個。"
  - id: q-e26-3
    episode: E26
    q: {en: "You got a small PR merged into vLLM. What's the best way to show it?", zh: "你有一個小 PR 被 merge 進 vLLM 了。最好的展示方式是？"}
    options:
      en: ["'Contributor to vLLM' with no link", "A one-line bullet: what you changed, why, the measured effect, and the PR link", "Hide it because it's small", "List every file you touched"]
      zh: ["寫「vLLM 貢獻者」但不附連結", "一行條列：改了什麼、為什麼、量測到的效果，再加上 PR 連結", "因為太小所以不提", "列出你動到的每個檔案"]
    answer: 1
    explain:
      en: "Small and specific beats big and vague. Reviewers click links."
      zh: "小而具體，勝過大而模糊。審閱履歷的人會點連結。"
