# Multiple-choice questions. `answer` is the 0-based index of the correct option.
# Options must be in the same order in both languages.
quizzes:
  # ---------------- S0 ----------------
  - id: q-e01-1
    episode: E01
    q: {en: "What does one forward pass of a decoder LLM produce during generation?", zh: "生成時，decoder LLM 的一次 forward 會產生什麼？"}
    options:
      en: ["A full sentence", "A probability distribution over the next token", "The KV cache only", "A list of candidate answers"]
      zh: ["一整個句子", "下一個 token 的機率分布", "只有 KV cache", "一串候選答案"]
    answer: 1
    explain:
      en: "Each pass scores every vocabulary entry as the next token; sampling picks one, and the loop repeats."
      zh: "每次 forward 會替詞表中每個項目打分數，作為下一個 token 的候選；抽樣選出一個後，迴圈繼續。"
  - id: q-e01-2
    episode: E01
    q: {en: "Processing the whole prompt in the first forward pass is called…", zh: "第一次 forward 處理整段 prompt，稱為…"}
    options:
      en: ["Decode", "Prefill", "Sampling", "Detokenization"]
      zh: ["Decode", "Prefill", "Sampling（抽樣）", "Detokenization（反 tokenize）"]
    answer: 1
    explain:
      en: "Prefill processes the known prompt tokens (in parallel); decode then advances one generated token per step."
      zh: "Prefill 處理已知的 prompt token（可平行）；之後 decode 每一步推進一個生成的 token。"
  - id: q-e01-3
    episode: E01
    q: {en: "Which job belongs to the serving engine (vLLM), not the model weights?", zh: "下列哪一項是推論引擎（vLLM）的工作，而不是模型權重的工作？"}
    options:
      en: ["Computing attention scores", "Deciding which user's request runs in the next step", "Storing what the model learned", "Choosing the vocabulary"]
      zh: ["計算 attention 分數", "決定下一步要跑哪個使用者的請求", "儲存模型學到的知識", "決定詞表"]
    answer: 1
    explain:
      en: "Scheduling, memory management, batching and streaming are engine responsibilities."
      zh: "排程、記憶體管理、批次處理與串流輸出，都是引擎的責任。"
  - id: q-e02-1
    episode: E02
    q: {en: "Why did models historically struggle to count letters in \"strawberry\"?", zh: "為什麼模型過去很難數出「strawberry」有幾個字母？"}
    options:
      en: ["They lack enough parameters", "They see subword tokens, not individual characters", "English is not in their training data", "Sampling temperature was too high"]
      zh: ["參數不夠多", "它們看到的是 subword token，不是單一字元", "訓練資料裡沒有英文", "抽樣溫度太高"]
    answer: 1
    explain:
      en: "Tokenizers merge characters into chunks, so letter-level structure is hidden inside token IDs."
      zh: "Tokenizer 把字元合併成碎片，字母層級的結構被藏在 token ID 裡面。"
  - id: q-e02-2
    episode: E02
    q: {en: "Context-window limits and API prices are usually counted in…", zh: "Context window 上限和 API 價格，通常用什麼計算？"}
    options:
      en: ["Characters", "Words", "Tokens", "Bytes of UTF-8"]
      zh: ["字元", "單字", "Token", "UTF-8 位元組"]
    answer: 2
    explain:
      en: "Everything inside the model, including KV memory, scales with tokens."
      zh: "模型內部的一切（包含 KV 記憶體）都隨 token 數變化。"
  - id: q-e02-3
    episode: E02
    q: {en: "What does a chat template do?", zh: "Chat template 的作用是什麼？"}
    options:
      en: ["Translates the reply", "Serializes roles and messages into one token stream with special tokens", "Compresses the KV cache", "Selects the GPU kernel"]
      zh: ["翻譯回覆", "把角色與訊息序列化成一條帶特殊 token 的 token 串", "壓縮 KV cache", "選擇 GPU kernel"]
    answer: 1
    explain:
      en: "The model only sees a flat sequence; the template defines how system/user/assistant turns are encoded."
      zh: "模型只看得到一條扁平的序列；template 定義 system/user/assistant 各輪要怎麼編碼。"
  - id: q-e03-1
    episode: E03
    q: {en: "What does the causal mask prevent?", zh: "因果遮罩（causal mask）防止什麼？"}
    options:
      en: ["Exploding gradients", "A token attending to future positions", "Overfitting", "Tokens attending to themselves"]
      zh: ["梯度爆炸", "token 去注意未來的位置", "過擬合", "token 注意自己"]
    answer: 1
    explain:
      en: "Position i may only attend to positions ≤ i, which makes the model a valid next-token predictor."
      zh: "位置 i 只能注意 ≤ i 的位置，模型才是合法的下一個 token 預測器。"
  - id: q-e03-2
    episode: E03
    q: {en: "Attention scores are computed as…", zh: "Attention 分數的計算方式是…"}
    options:
      en: ["softmax(QKᵀ/√d)", "ReLU(QV)", "sigmoid(K+V)", "QKV summed then normalized"]
      zh: ["softmax(QKᵀ/√d)", "ReLU(QV)", "sigmoid(K+V)", "把 Q、K、V 相加後正規化"]
    answer: 0
    explain:
      en: "Scaled dot-product between queries and keys, softmaxed into weights that mix the values."
      zh: "Query 與 key 做縮放點積，經過 softmax 變成權重，再拿來混合 value。"
  - id: q-e03-3
    episode: E03
    q: {en: "Which is NOT a typical difference between modern Llama/Qwen and a textbook Transformer?", zh: "下列哪一項「不是」現代 Llama/Qwen 與教科書 Transformer 的典型差異？"}
    options:
      en: ["RoPE positions", "Grouped-query attention", "RMSNorm", "Removing attention entirely"]
      zh: ["RoPE 位置編碼", "Grouped-query attention", "RMSNorm", "完全拿掉 attention"]
    answer: 3
    explain:
      en: "They keep attention; they change positions, KV-head sharing, normalization and the MLP activation."
      zh: "它們保留 attention；改的是位置編碼、KV head 共用、正規化方式與 MLP 的激活函數。"
  - id: q-e04-1
    episode: E04
    q: {en: "Why can training process all positions of a sequence in parallel?", zh: "為什麼訓練時可以平行處理序列的所有位置？"}
    options:
      en: ["GPUs are faster during training", "Teacher forcing: the true previous tokens are already known", "Training uses no attention", "Gradients are computed on CPU"]
      zh: ["訓練時 GPU 比較快", "Teacher forcing：正確的前一個 token 都已知", "訓練不用 attention", "梯度在 CPU 上計算"]
    answer: 1
    explain:
      en: "With the ground-truth sequence available, every position's input is known up front."
      zh: "有了正確答案序列，每個位置的輸入一開始就都知道了。"
  - id: q-e04-2
    episode: E04
    q: {en: "Which statement about inference cost is most accurate?", zh: "關於推論成本，哪一個敘述最正確？"}
    options:
      en: ["It's a one-time cost like training", "It grows with every user and every token served", "It's zero once the model is trained", "It only depends on model size"]
      zh: ["和訓練一樣是一次性成本", "隨著服務的每個使用者、每個 token 增加", "模型訓練完就變成零", "只和模型大小有關"]
    answer: 1
    explain:
      en: "Inference runs for the lifetime of the product, which is why making it efficient matters so much."
      zh: "推論會跟著產品一直跑下去，所以讓它更有效率非常重要。"
  # ---------------- S1 ----------------
  - id: q-e05-1
    episode: E05
    q: {en: "At batch size 1, LLM decode on a modern GPU is usually limited by…", zh: "Batch size 1 時，現代 GPU 上的 LLM decode 通常受限於…"}
    options:
      en: ["Tensor-core FLOPs", "Memory bandwidth", "Disk I/O", "Network latency"]
      zh: ["Tensor core 算力", "記憶體頻寬", "硬碟 I/O", "網路延遲"]
    answer: 1
    explain:
      en: "All weights are streamed from HBM for ~2 FLOPs each, so bytes moved, not math, sets the time."
      zh: "所有權重都要從 HBM 搬出來，每個只做約 2 FLOP，所以決定時間的是搬了多少 bytes，不是運算量。"
  - id: q-e05-2
    episode: E05
    q: {en: "An 8B bf16 model on a GPU with 3.35 TB/s bandwidth. Best-case single-user decode speed is roughly…", zh: "8B bf16 模型，GPU 頻寬 3.35 TB/s。單一使用者 decode 的理論最佳速度大約是…"}
    options:
      en: ["20 tokens/s", "200 tokens/s", "2,000 tokens/s", "20,000 tokens/s"]
      zh: ["每秒 20 個 token", "每秒 200 個 token", "每秒 2,000 個 token", "每秒 20,000 個 token"]
    answer: 1
    explain:
      en: "16 GB per step ÷ 3.35 TB/s ≈ 4.8 ms → ~200 tokens/s (ignoring KV reads and overheads)."
      zh: "每步 16 GB ÷ 3.35 TB/s ≈ 4.8 ms → 每秒約 200 個 token（忽略 KV 讀取與其他開銷）。"
  - id: q-e05-3
    episode: E05
    q: {en: "Why does batching many users improve decode throughput?", zh: "為什麼把很多使用者一起批次處理，能提高 decode 吞吐量？"}
    options:
      en: ["It reduces the model size", "Each weight loaded from memory is reused for many tokens", "It skips attention", "It lowers the clock speed"]
      zh: ["它讓模型變小", "從記憶體載入的每個權重，可以被很多個 token 重複使用", "它跳過 attention", "它降低時脈"]
    answer: 1
    explain:
      en: "Arithmetic intensity rises roughly with batch size until compute becomes the limit."
      zh: "算術強度大致隨 batch size 上升，直到算力變成瓶頸。"
  - id: q-e06-1
    episode: E06
    q: {en: "Why is it valid to reuse cached K/V for earlier tokens?", zh: "為什麼可以重複使用早先 token 的快取 K/V？"}
    options:
      en: ["Weights change slowly", "Causal masking means earlier tokens' K/V never depend on later tokens", "The cache is recomputed every step anyway", "Attention is linear"]
      zh: ["權重變化很慢", "因果遮罩讓早先 token 的 K/V 永遠不依賴後面的 token", "反正每一步都會重算 cache", "Attention 是線性的"]
    answer: 1
    explain:
      en: "Past positions can't see the future, so their K/V are fixed once computed."
      zh: "過去的位置看不到未來，所以它們的 K/V 一旦算出來就固定了。"
  - id: q-e06-2
    episode: E06
    q: {en: "After prefilling prompt [11, 22, 33] and sampling 44, how many positions are in the KV cache?", zh: "Prefill prompt [11, 22, 33] 並抽樣出 44 之後，KV cache 裡有幾個位置？"}
    options:
      en: ["2", "3", "4", "5"]
      zh: ["2", "3", "4", "5"]
    answer: 1
    explain:
      en: "44 is sampled but not yet processed; it enters the cache on the next forward pass."
      zh: "44 已經抽樣出來，但還沒被處理；下一次 forward 才會進 cache。"
  - id: q-e06-3
    episode: E06
    q: {en: "KV memory per token is proportional to…", zh: "每個 token 的 KV 記憶體與什麼成正比？"}
    options:
      en: ["Vocabulary size", "Layers × KV heads × head_dim × 2 × bytes", "Number of query heads only", "MLP width"]
      zh: ["詞表大小", "層數 × KV heads × head_dim × 2 × bytes", "只有 query head 數量", "MLP 寬度"]
    answer: 1
    explain:
      en: "Both K and V (×2) are stored per layer, per KV head."
      zh: "每一層、每個 KV head 都要存 K 和 V（所以 ×2）。"
  - id: q-e07-1
    episode: E07
    q: {en: "Llama-3.1-70B (80 layers, 8 KV heads, head_dim 128, bf16). KV per token is about…", zh: "Llama-3.1-70B（80 層、8 個 KV heads、head_dim 128、bf16）。每個 token 的 KV 大約是…"}
    options:
      en: ["40 KiB", "320 KiB", "2.5 MiB", "40 GiB"]
      zh: ["40 KiB", "320 KiB", "2.5 MiB", "40 GiB"]
    answer: 1
    explain:
      en: "2 × 80 × 8 × 128 × 2 B = 327,680 B = 320 KiB."
      zh: "2 × 80 × 8 × 128 × 2 B = 327,680 B = 320 KiB。"
  - id: q-e07-2
    episode: E07
    q: {en: "A candidate uses 64 query heads instead of 8 KV heads in the formula. Their answer is…", zh: "某位面試者在公式裡用了 64 個 query heads，而不是 8 個 KV heads。他的答案會…"}
    options:
      en: ["Correct", "2× too big", "8× too big", "8× too small"]
      zh: ["正確", "大 2 倍", "大 8 倍", "小 8 倍"]
    answer: 2
    explain:
      en: "With GQA, 8 query heads share each KV head; only KV heads are cached."
      zh: "在 GQA 中，每 8 個 query heads 共用一個 KV head；只有 KV heads 會被快取。"
  - id: q-e07-3
    episode: E07
    q: {en: "Switching the KV cache from bf16 to FP8 roughly…", zh: "把 KV cache 從 bf16 換成 FP8，大約會…"}
    options:
      en: ["Halves KV memory per token", "Doubles KV memory per token", "Has no effect on memory", "Removes the need for a KV cache"]
      zh: ["每 token KV 記憶體減半", "每 token KV 記憶體加倍", "對記憶體沒有影響", "不再需要 KV cache"]
    answer: 0
    explain:
      en: "1 byte per value instead of 2, plus small scale metadata, so about 2× more tokens fit."
      zh: "每個數值從 2 bytes 變 1 byte（再加一點 scale 資料），大約可以放 2 倍的 token。"
  - id: q-e08-1
    episode: E08
    q: {en: "PagedAttention is most directly inspired by…", zh: "PagedAttention 最直接的靈感來源是…"}
    options:
      en: ["Database indexes", "Virtual memory paging in operating systems", "TCP congestion control", "Garbage collection"]
      zh: ["資料庫索引", "作業系統的虛擬記憶體分頁", "TCP 壅塞控制", "垃圾回收"]
    answer: 1
    explain:
      en: "Fixed-size pages plus a per-sequence page (block) table, just like an OS."
      zh: "固定大小的分頁加上每個序列一張分頁（block）表，和作業系統一樣。"
  - id: q-e08-2
    episode: E08
    q: {en: "With paged KV, the maximum wasted KV space per request is about…", zh: "使用分頁 KV 時，每個請求最多浪費的 KV 空間大約是…"}
    options:
      en: ["Half the max length", "One partially filled block", "Zero, always", "One full layer"]
      zh: ["最大長度的一半", "一個沒填滿的 block", "永遠是零", "一整層"]
    answer: 1
    explain:
      en: "Blocks are allocated on demand; only the last block may be partly empty."
      zh: "Block 是需要時才配置；只有最後一個 block 可能沒填滿。"
  - id: q-e08-3
    episode: E08
    q: {en: "What lets two requests safely share the same physical KV block?", zh: "什麼機制讓兩個請求能安全共用同一個實體 KV block？"}
    options:
      en: ["Locks on every token", "Reference counting (plus copy-on-write if one diverges)", "Duplicating the block", "Sharing is impossible"]
      zh: ["每個 token 都上鎖", "參照計數（若其中一個分歧，則 copy-on-write）", "複製一份 block", "不可能共用"]
    answer: 1
    explain:
      en: "A block is freed only when its ref count reaches zero; full shared blocks are treated as immutable."
      zh: "Block 只有在參照計數歸零時才會釋放；填滿的共用 block 被視為不可變。"
  # ---------------- S2 ----------------
  - id: q-e09-1
    episode: E09
    q: {en: "The main waste in static (request-level) batching is…", zh: "Static（以請求為單位的）batching 主要的浪費是…"}
    options:
      en: ["Too many kernels", "Slots idle while waiting for the longest request in the batch", "Tokenization overhead", "Too much prefix caching"]
      zh: ["kernel 太多", "等待批次中最長的請求時，其他位置空轉", "tokenize 的開銷", "prefix caching 太多"]
    answer: 1
    explain:
      en: "Finished requests can't be replaced until the whole batch completes."
      zh: "完成的請求在整批結束前，沒辦法被替換掉。"
  - id: q-e09-2
    episode: E09
    q: {en: "Continuous batching re-decides batch membership…", zh: "Continuous batching 多久重新決定一次批次成員？"}
    options:
      en: ["Once per request", "Every iteration (forward step)", "Once per minute", "Only when the GPU is idle"]
      zh: ["每個請求一次", "每個迭代（每次 forward）", "每分鐘一次", "只有 GPU 閒置時"]
    answer: 1
    explain:
      en: "That's why it's also called iteration-level scheduling (Orca, OSDI 2022)."
      zh: "所以它也叫做 iteration-level scheduling（Orca，OSDI 2022）。"
  - id: q-e09-3
    episode: E09
    q: {en: "With continuous batching, what usually limits how many requests run at once?", zh: "使用 continuous batching 時，通常是什麼限制同時能跑多少請求？"}
    options:
      en: ["The tokenizer", "Free KV cache blocks (and max_num_seqs)", "The HTTP server", "The number of CPU cores"]
      zh: ["Tokenizer", "空閒的 KV cache block（以及 max_num_seqs）", "HTTP 伺服器", "CPU 核心數"]
    answer: 1
    explain:
      en: "Admission needs KV space; when it runs out, vLLM stops admitting or preempts."
      zh: "進場需要 KV 空間；用完時，vLLM 會停止接收新請求或進行搶占。"
  - id: q-e10-1
    episode: E10
    q: {en: "vLLM's prefix-cache block hash includes the parent block's hash so that…", zh: "vLLM 的 prefix cache 在 block hash 中包含上一個 block 的 hash，目的是…"}
    options:
      en: ["Hashing is faster", "A block only matches if everything before it also matched", "Blocks can be reordered", "It saves memory"]
      zh: ["讓 hash 更快", "只有前面所有內容都相同時，這個 block 才會命中", "讓 block 可以重新排序", "節省記憶體"]
    answer: 1
    explain:
      en: "KV depends on all previous tokens, so identical block contents with different history are not reusable."
      zh: "KV 取決於所有之前的 token；內容相同但歷史不同的 block 不能重複使用。"
  - id: q-e10-2
    episode: E10
    q: {en: "To maximize prefix-cache hits, structure prompts as…", zh: "要讓 prefix cache 命中率最高，prompt 應該怎麼排？"}
    options:
      en: ["User question first, system prompt last", "Stable shared content first, per-user content last", "Random order", "Put a timestamp at the very start"]
      zh: ["使用者問題放前面、system prompt 放最後", "穩定共用的內容放前面、每個使用者不同的內容放後面", "隨機排序", "在最前面放時間戳記"]
    answer: 1
    explain:
      en: "One differing token early breaks every block after it. A timestamp at the start kills caching."
      zh: "前面只要有一個 token 不同，後面所有 block 都會失效。開頭放時間戳記等於關掉快取。"
  - id: q-e10-3
    episode: E10
    q: {en: "Which blocks are eligible for prefix caching in vLLM?", zh: "在 vLLM 中，哪些 block 可以被 prefix cache？"}
    options:
      en: ["Any block, including partial ones", "Only full blocks", "Only the first block", "Only decode blocks"]
      zh: ["任何 block，包含沒填滿的", "只有填滿的 block", "只有第一個 block", "只有 decode 的 block"]
    answer: 1
    explain:
      en: "Partial blocks are still being written, so their identity isn't final."
      zh: "沒填滿的 block 還在寫入中，身分還沒確定。"
  - id: q-e11-1
    episode: E11
    q: {en: "What problem does chunked prefill solve?", zh: "Chunked prefill 解決什麼問題？"}
    options:
      en: ["Model too large for one GPU", "A long prompt monopolizing steps and stalling other users' decodes", "Tokenizer errors", "Low accuracy"]
      zh: ["模型太大放不進一張 GPU", "長 prompt 佔據好幾個步驟，讓其他使用者的 decode 卡住", "Tokenizer 錯誤", "準確度太低"]
    answer: 1
    explain:
      en: "Splitting the prefill keeps every step mixed with decodes, so ITL stays smooth."
      zh: "把 prefill 切開，讓每一步都混著 decode，ITL 就能保持平順。"
  - id: q-e11-2
    episode: E11
    q: {en: "Which vLLM setting is the per-step token budget?", zh: "vLLM 中哪個設定是每一步的 token 預算？"}
    options:
      en: ["max_model_len", "max_num_batched_tokens", "gpu_memory_utilization", "block_size"]
      zh: ["max_model_len", "max_num_batched_tokens", "gpu_memory_utilization", "block_size"]
    answer: 1
    explain:
      en: "The scheduler starts each step with token_budget = max_num_batched_tokens (scheduler.py)."
      zh: "排程器每一步開始時 token_budget = max_num_batched_tokens（見 scheduler.py）。"
  - id: q-e11-3
    episode: E11
    q: {en: "Chunked prefill typically trades…", zh: "Chunked prefill 通常是用什麼換什麼？"}
    options:
      en: ["Accuracy for speed", "Slightly higher TTFT for the long request vs smoother ITL for everyone", "Memory for accuracy", "Nothing, it's free"]
      zh: ["用準確度換速度", "長請求的 TTFT 稍微變高，換來所有人更平順的 ITL", "用記憶體換準確度", "什麼都不用換，完全免費"]
    answer: 1
    explain:
      en: "The big prompt finishes prefill over more steps, while decoders keep getting tokens."
      zh: "大 prompt 要花更多步驟完成 prefill，而 decode 中的請求持續拿到 token。"
  - id: q-e12-1
    episode: E12
    q: {en: "A core correctness test for an incremental KV engine compares…", zh: "增量 KV 引擎的核心正確性測試，比較的是…"}
    options:
      en: ["Speed vs a GPU", "Cached logits vs dense (recompute-everything) logits", "Memory usage vs vLLM", "Tokenizer output vs HF"]
