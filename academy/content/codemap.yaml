# vLLM code map. Every path and line was checked against the pinned commit below.
# When you re-pin, re-check every path, symbol and line at the new commit (git grep), then update hunts.yaml answers.
pin:
  repo: vllm-project/vllm
  commit: 74f4404f58c0fb16821b34c16343486eeaf164a5
  date: "2026-10-12"
  note:
    en: "vLLM main on 12 Oct 2026 (after v0.31.0). Line numbers drift on main, so the permalinks stay on this commit."
    zh: "2026 年 10 月 12 日的 vLLM main（v0.31.0 之後）。main 上的行號會飄移，所以永久連結固定在這個 commit。"

