    claim:
      en: "The Rust frontend becomes vLLM's default API server before 2027."
      zh: "Rust 前端會在 2027 年前成為 vLLM 預設的 API server。"
    evidence:
      en: "An experimental drop-in Rust (axum) frontend now lives in `rust/` on main and talks to the Python engine core over the same ZMQ boundary, with optional gRPC. It got 45+ commits in three weeks."
      zh: "實驗性、可直接替換的 Rust（axum）前端現在放在 main 的 `rust/` 裡，透過同一條 ZMQ 邊界和 Python engine core 溝通，還可選用 gRPC。三週內進了 45 個以上的 commit。"
    wrong_if:
      en: "On 31 Dec 2026, `vllm serve` still launches the Python API server unless you opt in."
      zh: "2026 年 12 月 31 日時，`vllm serve` 還是預設啟動 Python API server，要自己選擇才會用 Rust。"
    source: "https://github.com/vllm-project/vllm/tree/main/rust"
