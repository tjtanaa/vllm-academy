  - id: kv_accountant
    emoji: "🧮"
    name: {en: "KV Accountant", zh: "KV 會計師"}
    how: {en: "Complete E07 and run /kvcalc.", zh: "完成 E07 並使用 /kvcalc。"}
  - id: pager
    emoji: "📄"
    name: {en: "Pager", zh: "分頁手"}
    how: {en: "Finish Season 1.", zh: "完成第一季。"}
  - id: engine_builder
    emoji: "⚙️"
    name: {en: "Engine Builder", zh: "引擎打造者"}
    how: {en: "Finish Season 2.", zh: "完成第二季。"}
  - id: navigator
    emoji: "🧭"
    name: {en: "Navigator", zh: "領航員"}
    how: {en: "Solve 5 codebase hunts.", zh: "解開 5 題原始碼尋寶。"}
  - id: interview_ready
    emoji: "🎤"
    name: {en: "Interview Ready", zh: "面試準備就緒"}
