[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-academy-mini"
version = "0.1.0"
description = "vLLM Academy educational engine; not the vLLM runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
docs = ["mistune>=3,<4"]

[tool.setuptools.packages.find]
include = ["mini_vllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
