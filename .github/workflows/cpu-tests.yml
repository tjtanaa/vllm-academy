name: CPU teaching checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'pytest>=8,<10'
      - name: Validate lessons and code
        run: |
          python labs/check_course.py
          python labs/check_versions.py
          python -m compileall -q mini_vllm labs tests
          bash -n labs/serve.sh
          bash -n labs/bench.sh
          python -m pytest -q
          python -m mini_vllm.demo
# Workflow results must be checked separately from local validation.
# Validate/pin action revisions under the destination repository's security policy.
# Do not add privileged self-hosted GPU jobs to untrusted pull_request execution.
